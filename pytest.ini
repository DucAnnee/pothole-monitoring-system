[pytest]
testpaths =
    tests
    cloud/bev_surface_service
    tests/stress
markers =
    unit: fast component-level tests with no external services
    contract: schema/topic compatibility checks
    integration: tests that need one or more local services
    e2e: real edge-to-cloud pipeline tests
    stress: concurrent fan-out load tests (requires Docker + model artifacts)
    requires_models: tests that require local ML model artifacts
    requires_docker: tests that require Docker Compose
addopts = -ra
