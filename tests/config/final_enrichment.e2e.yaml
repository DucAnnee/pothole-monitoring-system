kafka:
  bootstrap_servers: "${KAFKA_BOOTSTRAP_SERVERS:localhost:19092,localhost:29092,localhost:39092}"
  schema_registry_url: "${SCHEMA_REGISTRY_URL:http://localhost:8082}"
  consumer_group_id: "final-enrichment-service-e2e"
  raw_events_topic: "pothole.raw.events.v2"
  severity_score_topic: "pothole.severity.score.v1"

trino:
  host: "${TRINO_HOST:localhost}"
  port: "${TRINO_PORT:8081}"
  user: "trino"
  catalog: "iceberg"
  schema: "city"

redis:
  host: "${REDIS_HOST:localhost}"
  port: "${REDIS_PORT:6379}"

h3:
  dedup_resolution: 12
  cache_resolution: 10

cache:
  key_prefix: "osm:h3:"
  ttl_seconds: 2592000

osm:
  min_request_interval: 1.1

aggregation:
  timeout_seconds: "${AGGREGATION_TIMEOUT_SECONDS:300}"
  cleanup_interval_seconds: "${CLEANUP_INTERVAL_SECONDS:5}"

logging:
  level: "INFO"
  log_timeout_warnings: true
