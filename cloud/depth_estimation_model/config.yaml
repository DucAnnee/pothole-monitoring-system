# ============================================================================
# CLOUD DEPTH ESTIMATION SERVICE - CONFIGURATION
# ============================================================================

# Kafka configuration
kafka:
  source_topic: "pothole.surface.area.v2"
  output_topic: "pothole.depth.v1"
  consumer_group_id: "depth-estimator-cloud-group"
  bootstrap_servers: "${KAFKA_BOOTSTRAP_SERVERS:localhost:19092,localhost:29092,localhost:39092}"
  schema_registry_url: "${SCHEMA_REGISTRY_URL:http://localhost:8082}"
  max_retries: 5
  retry_delay: 2

# MinIO configuration
minio:
  endpoint: "${MINIO_ENDPOINT:localhost:9000}"
  access_key: "${MINIO_ACCESS_KEY:minioadmin}"
  secret_key: "${MINIO_SECRET_KEY:minioadmin}"
  bucket: "warehouse"
  secure: false
  max_retries: 5
  retry_delay: 2

# Triton Inference Server connection (gRPC)
triton:
  host: "${TRITON_HOST:localhost}"
  grpc_port: "${TRITON_GRPC_PORT:8001}"
  model_name: "depth_anything_v2"
  model_version: "1"
  timeout_seconds: 30

# Client-side batch accumulation (flush on count OR timeout)
batching:
  max_batch_size: "${BATCH_MAX_SIZE:8}"
  batch_timeout_ms: "${BATCH_TIMEOUT_MS:200}"

# Processing configuration
processing:
  model_input_size: 518
  depth_min_cm: 1.0
  depth_max_cm: 50.0
  confidence_min: 0.75
  confidence_max: 0.98

# Logging configuration
logging:
  level: "INFO"
  show_progress: true
