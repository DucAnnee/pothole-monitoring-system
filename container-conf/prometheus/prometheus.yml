global:
  scrape_interval: 15s
scrape_configs:
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
  - job_name: kafka
    static_configs: [{ targets: ["kafka-exporter:9308"] }]
  - job_name: flink-jobmanager
    static_configs: [{ targets: ["flink-jobmanager:9249"] }]
  - job_name: flink-taskmanager
    static_configs: [{ targets: ["flink-taskmanager:9249"] }]
  - job_name: triton
    static_configs: [{ targets: ["triton-inference-server:8002"] }]
  - job_name: postgis
    static_configs: [{ targets: ["postgres-exporter:9187"] }]
  - job_name: redis
    static_configs: [{ targets: ["redis-exporter:9121"] }]
  - job_name: cadvisor
    static_configs: [{ targets: ["cadvisor:8080"] }]
  - job_name: pipeline-observer
    static_configs: [{ targets: ["pipeline-observer:8009"] }]
